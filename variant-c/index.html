document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

02Fhelmet>\n\n<header style=\"max-width:1180px;margin:0 auto;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n  <img src=\"https://printpunthuizen.nl/wp-content/uploads/2025/02/PPH_logo.png\" alt=\"Printpunt Huizen\" style=\"height:48px;width:auto;display:block\">\n  <div style=\"display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:15px\">\n    <sc-if value=\"{{ showStatus }}\" hint-placeholder-val=\"{{ true }}\">\n      <span style=\"display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #ebe5d6;padding:8px 14px;border-radius:999px;font-weight:500\"><span style=\"width:9px;height:9px;border-radius:50%;background:{{ statusColor }}\"><\u002Fspan>{{ statusText }}<\u002Fspan>\n    <\u002Fsc-if>\n    <a href=\"tel:0633868444\" style=\"font-weight:700;color:#1f2a44\">06 – 33 86 84 44<\u002Fa>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section data-screen-label=\"Welkom\" style=\"max-width:1180px;margin:0 auto;padding:48px 24px 40px;display:flex;flex-direction:column;gap:56px\">\n  <div style=\"display:flex;flex-direction:column;gap:26px;max-width:860px\">\n    <h1 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(48px,8vw,104px);line-height:0.95;font-weight:800;letter-spacing:-0.03em;text-wrap:balance\">Goedendag! <span style=\"color:#2f6fb5\">Kom gerust binnen.<\u002Fspan><\u002Fh1>\n    <p style=\"margin:0;font-size:clamp(19px,2vw,23px);line-height:1.5;color:#46506b;max-width:40ch;text-wrap:pretty\">Printpunt Huizen is er voor iedereen, of je nu een particuliere of zakelijke klant bent. Van één kopie tot grote oplages.<\u002Fp>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n      <a href=\"#langskomen\" style=\"background:#1f2a44;color:#fff;padding:16px 26px;border-radius:14px;font-weight:700;font-size:16px;text-decoration:none\" style-hover=\"background:#2f6fb5\">Hoe vind ik jullie?<\u002Fa>\n      <a href=\"mailto:info@printpunthuizen.nl\" style=\"background:#c5da45;color:#1f2a44;padding:16px 26px;border-radius:14px;font-weight:700;font-size:16px;text-decoration:none\" style-hover=\"background:#b3c936\">Mail een bestand<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px\">\n    <div style=\"aspect-ratio:3/4;background:#2f6fb5;color:#fff;border-radius:6px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;transform:rotate(-2deg);box-shadow:0 14px 24px -18px rgba(31,42,68,0.6);transition:transform .25s\" style-hover=\"transform:rotate(0) translateY(-6px)\"><span style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:700\">Posters<\u002Fspan><\u002Fdiv>\n    <div style=\"aspect-ratio:3/4;background:#c5da45;color:#1f2a44;border-radius:6px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;transform:rotate(1.5deg);box-shadow:0 14px 24px -18px rgba(31,42,68,0.6);transition:transform .25s\" style-hover=\"transform:rotate(0) translateY(-6px)\"><span style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:700\">Flyers<\u002Fspan><\u002Fdiv>\n    <div style=\"aspect-ratio:3/4;background:#f4b5c2;color:#1f2a44;border-radius:6px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;transform:rotate(-1deg);box-shadow:0 14px 24px -18px rgba(31,42,68,0.6);transition:transform .25s\" style-hover=\"transform:rotate(0) translateY(-6px)\"><span style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:700\">Geboorte­kaartjes<\u002Fspan><\u002Fdiv>\n    <div style=\"aspect-ratio:3/4;background:#ffd76a;color:#1f2a44;border-radius:6px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;transform:rotate(2deg);box-shadow:0 14px 24px -18px rgba(31,42,68,0.6);transition:transform .25s\" style-hover=\"transform:rotate(0) translateY(-6px)\"><span style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:700\">Folders<\u002Fspan><\u002Fdiv>\n    <div style=\"aspect-ratio:3/4;background:#1f2a44;color:#fff;border-radius:6px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;transform:rotate(-1.5deg);box-shadow:0 14px 24px -18px rgba(31,42,68,0.6);transition:transform .25s\" style-hover=\"transform:rotate(0) translateY(-6px)\"><span style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:700\">Visite­kaartjes<\u002Fspan><\u002Fdiv>\n    <div style=\"aspect-ratio:3/4;background:#a9d6c4;color:#1f2a44;border-radius:6px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;transform:rotate(1deg);box-shadow:0 14px 24px -18px rgba(31,42,68,0.6);transition:transform .25s\" style-hover=\"transform:rotate(0) translateY(-6px)\"><span style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:700\">Brochures<\u002Fspan><\u002Fdiv>\n    <div style=\"aspect-ratio:3/4;background:#fff;color:#1f2a44;border:1.5px dashed #c9c1ac;border-radius:6px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;transform:rotate(-0.5deg)\"><span style=\"font-size:17px;font-style:italic;color:#6b7390\">en nog veel meer…<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Wat ik doe\" style=\"max-width:1180px;margin:0 auto;padding:100px 24px 60px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:56px\">\n  <h2 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(36px,4.5vw,54px);line-height:1;font-weight:800;letter-spacing:-0.02em\">Waar kan ik je mee helpen?<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding:24px 0;border-top:2px solid #1f2a44\">\n      <h3 style=\"margin:0;font-size:22px;font-weight:700\">Printen en kopiëren<\u002Fh3>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:#46506b\">Eén kopie of een grote oplage, in kleur of zwart-wit. Gewoon langskomen mag.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding:24px 0;border-top:1px solid #e2dccb\">\n      <h3 style=\"margin:0;font-size:22px;font-weight:700\">Ontwerp en opmaak<\u002Fh3>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:#46506b\">Heb je foto's en tekst, maar wil het niet lukken er iets moois van te maken? Lever het aan, dan maken we het samen.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding:24px 0;border-top:1px solid #e2dccb\">\n      <h3 style=\"margin:0;font-size:22px;font-weight:700\">Geboorte-, trouw- en rouwkaarten<\u002Fh3>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:#46506b\">Voor de momenten die ertoe doen. Met aandacht ontworpen en gedrukt.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px;padding:24px 0;border-top:1px solid #e2dccb;border-bottom:1px solid #e2dccb\">\n      <h3 style=\"margin:0;font-size:22px;font-weight:700\">Binden<\u002Fh3>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:#46506b\">Scripties, rapporten en presentaties netjes ingebonden.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Erik\" style=\"padding:60px 24px\">\n  <div style=\"max-width:1180px;margin:0 auto;background:#fff;border-radius:28px;padding:clamp(28px,5vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(32px,5vw,64px);align-items:center;box-shadow:0 1px 0 #ebe5d6\">\n    <div style=\"aspect-ratio:1/1;border-radius:50%;background:repeating-linear-gradient(135deg,#efeadc 0 12px,#e6e0cf 12px 24px);display:flex;align-items:center;justify-content:center;max-width:380px;width:100%;justify-self:center;border:10px solid #c5da45\">\n      <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px;color:#6b7390;background:#fbf8f1;padding:6px 10px;border-radius:6px\">foto van Erik, lachend<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:20px\">\n      <p style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(32px,4vw,46px);line-height:1.05;font-weight:800;letter-spacing:-0.02em\">Hoi, ik ben Erik.<\u002Fp>\n      <p style=\"margin:0;font-size:18px;line-height:1.65;color:#46506b\">Ik werk al ruim 21 jaar in de grafische sector. Eerst als creatief DTP'er, later ook als illustrator. Nu heb ik mijn eigen printshop in Huizen.<\u002Fp>\n      <p style=\"margin:0;font-size:18px;line-height:1.65;color:#46506b\">Wij behandelen alle klanten als gelijken en leveren kwaliteit. Twijfel je over formaat, papier of ontwerp? Vraag het gewoon, ik denk graag mee.<\u002Fp>\n      <p style=\"margin:0;font-size:18px;line-height:1.5;font-weight:500\">Tot snel bij Printpunt Huizen,<br><span style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:700;color:#2f6fb5\">Erik van Wijk<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ showPortfolio }}\" hint-placeholder-val=\"{{ true }}\">\n<section data-screen-label=\"Werk\" style=\"max-width:1180px;margin:0 auto;padding:80px 24px 40px;display:flex;flex-direction:column;gap:36px\">\n  <h2 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(36px,4.5vw,54px);line-height:1;font-weight:800;letter-spacing:-0.02em\">Laatst gemaakt<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px\">\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\"><div style=\"aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:#efeadc\"><img src=\"https://printpunthuizen.nl/wp-content/uploads/2025/03/EerstePakjeC.png\" alt=\"Geboortekaart\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv><figcaption style=\"font-size:16px;font-weight:500\">Geboortekaart<\u002Ffigcaption><\u002Ffigure>\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\"><div style=\"aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:#efeadc\"><img src=\"https://printpunthuizen.nl/wp-content/uploads/2025/03/Huisstijl_Zz.png\" alt=\"Huisstijl\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv><figcaption style=\"font-size:16px;font-weight:500\">Huisstijl<\u002Ffigcaption><\u002Ffigure>\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\"><div style=\"aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:#efeadc\"><img src=\"https://printpunthuizen.nl/wp-content/uploads/2025/03/Kaarten.png\" alt=\"Kaarten\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv><figcaption style=\"font-size:16px;font-weight:500\">Kaarten<\u002Ffigcaption><\u002Ffigure>\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\"><div style=\"aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:#efeadc\"><img src=\"https://printpunthuizen.nl/wp-content/uploads/2025/04/Binden.png\" alt=\"Binden\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv><figcaption style=\"font-size:16px;font-weight:500\">Binden<\u002Ffigcaption><\u002Ffigure>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<section data-screen-label=\"Bestanden\" style=\"max-width:1180px;margin:0 auto;padding:80px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:56px\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <h2 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(36px,4.5vw,54px);line-height:1;font-weight:800;letter-spacing:-0.02em\">Een bestand sturen<\u002Fh2>\n    <p style=\"margin:0;font-size:18px;line-height:1.6;color:#46506b\">Mail het naar <a href=\"mailto:info@printpunthuizen.nl\" style=\"font-weight:700\">info@printpunthuizen.nl<\u002Fa> (tot 25 MB), stuur een WeTransfer-link of neem een USB-stick mee. Ik kijk het altijd even na voordat ik print.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"background:#eef3d6;border-radius:22px;padding:28px 30px;display:flex;flex-direction:column;gap:14px\">\n    <p style=\"margin:0;font-weight:700;font-size:17px\">Voor het mooiste resultaat<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.5;color:#3a4462\">\n      <span>• Liefst een PDF. JPEG, PNG of TIFF kan ook.<\u002Fspan>\n      <span>• Minimaal 300 dpi.<\u002Fspan>\n      <span>• CMYK in plaats van RGB.<\u002Fspan>\n      <span>• 3 mm afloop rondom, als de kleur tot de rand loopt.<\u002Fspan>\n      <span>• Letters omgezet naar contouren, of de lettertypen meegestuurd.<\u002Fspan>\n      <span>• Alle lagen samengevoegd.<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:15px;font-style:italic;color:#5c6680\">Lukt dat niet? Geen probleem, stuur het toch. We lossen het samen op.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"langskomen\" data-screen-label=\"Langskomen\" style=\"background:#2f6fb5;color:#fff\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:100px 24px;display:flex;flex-direction:column;gap:48px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap\">\n      <h2 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(36px,4.5vw,54px);line-height:1;font-weight:800;letter-spacing:-0.02em\">Zo vind je ons<\u002Fh2>\n      <p style=\"margin:0;font-size:18px;line-height:1.5;color:#dbe7f6\">De Regentesse 102, 1273 JZ Huizen<br>maandag t/m vrijdag, 9.30 – 17.00 uur<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px\">\n      <div style=\"background:#fff;color:#1f2a44;border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"width:44px;height:44px;border-radius:50%;background:#c5da45;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px\">1<\u002Fspan>\n        <h3 style=\"margin:0;font-size:21px;font-weight:700\">Parkeer bij Oostermeent<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;line-height:1.55;color:#46506b\">Genoeg plek rondom het winkelcentrum. Buiten de parkeergarage is het blauwe zone: leg je parkeerschijf neer.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;color:#1f2a44;border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"width:44px;height:44px;border-radius:50%;background:#c5da45;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px\">2<\u002Fspan>\n        <h3 style=\"margin:0;font-size:21px;font-weight:700\">Loop het Geboortecentrum Zuiderzee binnen<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;line-height:1.55;color:#46506b\">We hebben geen eigen voordeur. De ingang is die van de verloskundige kliniek.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#c5da45;color:#1f2a44;border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"width:44px;height:44px;border-radius:50%;background:#1f2a44;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px\">3<\u002Fspan>\n        <h3 style=\"margin:0;font-size:21px;font-weight:700\">Achterin vind je ons<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;line-height:1.55;color:#2f3a55\">Loop door naar achteren. Welkom bij Printpunt Huizen!<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-radius:22px;overflow:hidden;height:360px;background:#25599a\">\n      <iframe title=\"Kaart\" src=\"https://maps.google.com/maps?q=De%20Regentesse%20102%2C%201273%20JZ%20Huizen&amp;z=16&amp;output=embed\" style=\"border:0;width:100%;height:100%;display:block\" loading=\"lazy\"><\u002Fiframe>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"max-width:1180px;margin:0 auto;padding:56px 24px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap\">\n  <p style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(24px,3vw,32px);font-weight:700;max-width:22ch;line-height:1.15\">Vragen? Mail, bel of app gerust.<\u002Fp>\n  <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n    <a href=\"https://wa.me/31633868444\" style=\"background:#1f2a44;color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;text-decoration:none\" style-hover=\"background:#2f6fb5\">06 – 33 86 84 44<\u002Fa>\n    <a href=\"mailto:info@printpunthuizen.nl\" style=\"border:1.5px solid #1f2a44;color:#1f2a44;padding:12.5px 20px;border-radius:14px;font-weight:700;text-decoration:none\" style-hover=\"background:#1f2a44;color:#fff\">info@printpunthuizen.nl<\u002Fa>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;toonOpenStatus&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;toonPortfolio&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() { this.t = setInterval(() => this.forceUpdate(), 60000); }\n  componentWillUnmount() { clearInterval(this.t); }\n  renderVals() {\n    const now = new Date(), d = now.getDay(), m = now.getHours() * 60 + now.getMinutes();\n    const open = d >= 1 && d <= 5 && m >= 570 && m < 1020;\n    return {\n      showStatus: this.props.toonOpenStatus ?? true,\n      showPortfolio: this.props.toonPortfolio ?? true,\n      statusText: open ? 'Nu open' : 'Nu dicht · ma–vr 9.30–17.00',\n      statusColor: open ? '#7fae1c' : '#d0563a'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
