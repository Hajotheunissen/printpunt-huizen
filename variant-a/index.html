  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

stem-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#2f6fb5;text-decoration:none}\na:hover{color:#2b3550;text-decoration:underline}\n*{box-sizing:border-box}\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<header style=\"position:sticky;top:0;z-index:10;background:rgba(251,250,246,0.95);backdrop-filter:blur(8px);border-bottom:1px solid #e6e4dc\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n    <a href=\"#top\" style=\"display:flex;align-items:center\"><img src=\"https://printpunthuizen.nl/wp-content/uploads/2025/02/PPH_logo.png\" alt=\"Printpunt Huizen\" style=\"height:46px;width:auto;display:block\"><\u002Fa>\n    <nav style=\"display:flex;gap:24px;flex-wrap:wrap;font-size:15px;font-weight:500;align-items:center\">\n      <a href=\"#diensten\" style=\"color:#2b3550\">Diensten<\u002Fa>\n      <a href=\"#portfolio\" style=\"color:#2b3550\">Portfolio<\u002Fa>\n      <a href=\"#aanleveren\" style=\"color:#2b3550\">Aanleveren<\u002Fa>\n      <a href=\"#over\" style=\"color:#2b3550\">Over<\u002Fa>\n      <a href=\"#contact\" style=\"color:#2b3550\">Contact<\u002Fa>\n      <a href=\"https://wa.me/31633868444\" style=\"background:#2b3550;color:#fff;padding:10px 18px;border-radius:999px;text-decoration:none\">06 – 33 86 84 44<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"top\" data-screen-label=\"Hero\" style=\"background:linear-gradient(170deg,#3d8fd8 0%,#2a5ea8 55%,#26325a 100%);color:#fff\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:88px 24px 96px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:56px;align-items:center\">\n    <div style=\"display:flex;flex-direction:column;gap:28px\">\n      <p style=\"margin:0;font-size:15px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#cfe26a\">Printshop in Huizen · particulier &amp; zakelijk<\u002Fp>\n      <h1 style=\"margin:0;font-size:clamp(40px,6vw,68px);line-height:1.04;font-weight:700;letter-spacing:-0.01em;text-wrap:balance\">Uw lokale adres voor ál uw printwerk<\u002Fh1>\n      <p style=\"margin:0;font-size:22px;line-height:1.45;font-weight:500;color:#d8e86e;max-width:30ch\">Posters • Kaartjes • Flyers • Folders • Brochures • Visitekaartjes<\u002Fp>\n      <p style=\"margin:0;font-size:18px;line-height:1.55;color:#e4ecf8;max-width:46ch;font-style:italic\">en nog veel meer… Van één kopie tot grote oplages, je bent van harte welkom.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n        <a href=\"#aanleveren\" style=\"background:#c5da45;color:#1f2a46;padding:15px 26px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none\">Bestand aanleveren<\u002Fa>\n        <a href=\"https://wa.me/31633868444\" style=\"border:2px solid rgba(255,255,255,0.7);color:#fff;padding:13px 24px;border-radius:999px;font-weight:500;font-size:16px;text-decoration:none\">App of bel ons<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fbfaf6;color:#2b3550;border-radius:22px;padding:32px;display:flex;flex-direction:column;gap:22px;box-shadow:0 30px 60px -30px rgba(10,20,50,0.6)\">\n      <sc-if value=\"{{ showStatus }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px\">\n          <span style=\"width:10px;height:10px;border-radius:50%;background:{{ statusColor }}\"><\u002Fspan>\n          <span>{{ statusText }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;flex-direction:column;gap:4px\">\n        <span style=\"font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#6b7591\">Openingstijden<\u002Fspan>\n        <span style=\"font-size:20px;font-weight:500\">maandag t/m vrijdag<\u002Fspan>\n        <span style=\"font-size:32px;font-weight:700\">9.30 – 17.00 uur<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:1px;background:#e6e4dc\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\">\n        <span style=\"font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#6b7591\">Adres<\u002Fspan>\n        <span style=\"font-size:18px;line-height:1.45\">De Regentesse 102, 1273 JZ Huizen<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#eef3d6;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#5e7a10\">Let op: ingang<\u002Fspan>\n        <span style=\"font-size:16px;line-height:1.5;font-weight:500\">De winkel zit binnen in verloskundige kliniek Geboortecentrum Zuiderzee. Loop door naar achteren.<\u002Fspan>\n      <\u002Fdiv>\n      <a href=\"#contact\" style=\"font-weight:700;font-size:15px;color:#2f6fb5\">Route &amp; parkeren →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"diensten\" data-screen-label=\"Diensten\" style=\"max-width:1200px;margin:0 auto;padding:104px 24px 40px;display:flex;flex-direction:column;gap:48px\">\n  <div style=\"display:flex;flex-direction:column;gap:14px;max-width:640px\">\n    <p style=\"margin:0;font-size:14px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7a9a1c\">Wat we doen<\u002Fp>\n    <h2 style=\"margin:0;font-size:clamp(32px,4vw,46px);line-height:1.1;font-weight:700;text-wrap:balance\">Voor kleine én grote opdrachten<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px\">\n    <div style=\"background:#fff;border:1px solid #e6e4dc;border-radius:18px;padding:30px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font-size:14px;font-weight:700;color:#2f6fb5\">01<\u002Fspan>\n      <h3 style=\"margin:0;font-size:22px;font-weight:700\">Printen &amp; kopiëren<\u002Fh3>\n      <p style=\"margin:0;font-size:16px;line-height:1.6;color:#55607c\">Van één kopie tot grote oplages. Posters, flyers, folders, brochures en visitekaartjes, voor particulier en zakelijk.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e6e4dc;border-radius:18px;padding:30px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font-size:14px;font-weight:700;color:#2f6fb5\">02<\u002Fspan>\n      <h3 style=\"margin:0;font-size:22px;font-weight:700\">DTP &amp; opmaak<\u002Fh3>\n      <p style=\"margin:0;font-size:16px;line-height:1.6;color:#55607c\">Heb je foto's en tekst, maar wil het niet lukken er iets moois van te maken? Lever alles aan en we maken, in overleg, wat je wilt hebben.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e6e4dc;border-radius:18px;padding:30px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font-size:14px;font-weight:700;color:#2f6fb5\">03<\u002Fspan>\n      <h3 style=\"margin:0;font-size:22px;font-weight:700\">Kaarten<\u002Fh3>\n      <p style=\"margin:0;font-size:16px;line-height:1.6;color:#55607c\">Geboorte-, trouw- en rouwkaarten. Persoonlijk ontworpen en netjes gedrukt.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e6e4dc;border-radius:18px;padding:30px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font-size:14px;font-weight:700;color:#2f6fb5\">04<\u002Fspan>\n      <h3 style=\"margin:0;font-size:22px;font-weight:700\">Afwerking<\u002Fh3>\n      <p style=\"margin:0;font-size:16px;line-height:1.6;color:#55607c\">Binden van scripties, rapporten en presentaties. Vraag naar de mogelijkheden.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ showPortfolio }}\" hint-placeholder-val=\"{{ true }}\">\n<section id=\"portfolio\" data-screen-label=\"Portfolio\" style=\"max-width:1200px;margin:0 auto;padding:80px 24px 40px;display:flex;flex-direction:column;gap:40px\">\n  <div style=\"display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <p style=\"margin:0;font-size:14px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7a9a1c\">Portfolio<\u002Fp>\n      <h2 style=\"margin:0;font-size:clamp(32px,4vw,46px);line-height:1.1;font-weight:700\">Recent werk<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:16px;color:#55607c;max-width:40ch;line-height:1.55\">Een greep uit kaarten, huisstijlen en bindwerk van de afgelopen maanden.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px\">\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:#eceae2\"><img src=\"https://printpunthuizen.nl/wp-content/uploads/2025/03/EerstePakjeC.png\" alt=\"Eerste pakje\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n      <figcaption style=\"font-size:15px;font-weight:500\">Geboortekaart<\u002Ffigcaption>\n    <\u002Ffigure>\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:#eceae2\"><img src=\"https://printpunthuizen.nl/wp-content/uploads/2025/03/Huisstijl_Zz.png\" alt=\"Huisstijl\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n      <figcaption style=\"font-size:15px;font-weight:500\">Huisstijl<\u002Ffigcaption>\n    <\u002Ffigure>\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:#eceae2\"><img src=\"https://printpunthuizen.nl/wp-content/uploads/2025/03/Kaarten.png\" alt=\"Kaarten\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n      <figcaption style=\"font-size:15px;font-weight:500\">Kaarten<\u002Ffigcaption>\n    <\u002Ffigure>\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:#eceae2\"><img src=\"https://printpunthuizen.nl/wp-content/uploads/2025/04/Binden.png\" alt=\"Binden\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n      <figcaption style=\"font-size:15px;font-weight:500\">Binden<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<section id=\"aanleveren\" data-screen-label=\"Aanleveren\" style=\"padding:80px 24px\">\n  <div style=\"max-width:1200px;margin:0 auto;background:#26325a;color:#fff;border-radius:28px;padding:clamp(32px,5vw,64px);display:flex;flex-direction:column;gap:48px\">\n    <div style=\"display:flex;flex-direction:column;gap:14px;max-width:680px\">\n      <p style=\"margin:0;font-size:14px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#cfe26a\">Aanleveren<\u002Fp>\n      <h2 style=\"margin:0;font-size:clamp(32px,4vw,46px);line-height:1.1;font-weight:700\">Zo lever je je bestand aan<\u002Fh2>\n      <p style=\"margin:0;font-size:18px;line-height:1.55;color:#d4dcef\">We accepteren <strong style=\"color:#fff\">PDF<\u002Fstrong> (bij voorkeur), <strong style=\"color:#fff\">JPEG<\u002Fstrong> of <strong style=\"color:#fff\">PNG<\u002Fstrong> (voor afbeeldingen) en <strong style=\"color:#fff\">TIFF<\u002Fstrong> (voor hoge resolutie).<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:40px\">\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <h3 style=\"margin:0;font-size:20px;font-weight:700;color:#cfe26a\">1 · Bestandsspecificaties<\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.5;color:#d4dcef\">\n          <p style=\"margin:0\"><strong style=\"color:#fff\">Afmetingen<\u002Fstrong> — juiste formaat, inclusief 3 mm afloop rondom indien nodig.<\u002Fp>\n          <p style=\"margin:0\"><strong style=\"color:#fff\">Resolutie<\u002Fstrong> — minimaal 300 dpi voor scherpe prints.<\u002Fp>\n          <p style=\"margin:0\"><strong style=\"color:#fff\">Kleurenmodus<\u002Fstrong> — CMYK (geen RGB).<\u002Fp>\n          <p style=\"margin:0\"><strong style=\"color:#fff\">Lettertypen<\u002Fstrong> — omzetten naar contouren of meeleveren.<\u002Fp>\n          <p style=\"margin:0\"><strong style=\"color:#fff\">Lagen<\u002Fstrong> — samenvoegen tot één laag.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <h3 style=\"margin:0;font-size:20px;font-weight:700;color:#cfe26a\">2 · Versturen<\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.5;color:#d4dcef\">\n          <p style=\"margin:0\"><strong style=\"color:#fff\">E-mail<\u002Fstrong> — <a href=\"mailto:info@printpunthuizen.nl\" style=\"color:#fff;text-decoration:underline\">info@printpunthuizen.nl<\u002Fa> (max. 25 MB per mail).<\u002Fp>\n          <p style=\"margin:0\"><strong style=\"color:#fff\">WeTransfer of cloud<\u002Fstrong> — deel de downloadlink met ons.<\u002Fp>\n          <p style=\"margin:0\"><strong style=\"color:#fff\">USB-stick<\u002Fstrong> — breng je bestanden langs in de winkel.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <h3 style=\"margin:0;font-size:20px;font-weight:700;color:#cfe26a\">3 · Controle<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;line-height:1.5;color:#d4dcef\">Voordat we printen controleren we je bestand op technische fouten. Indien nodig nemen we contact met je op.<\u002Fp>\n        <a href=\"mailto:info@printpunthuizen.nl\" style=\"align-self:flex-start;background:#c5da45;color:#1f2a46;padding:14px 24px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none\">Mail je bestand<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"over\" data-screen-label=\"Over\" style=\"max-width:1200px;margin:0 auto;padding:40px 24px 80px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:56px;align-items:center\">\n  <div style=\"aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:repeating-linear-gradient(135deg,#eceae2 0 12px,#e4e1d7 12px 24px);display:flex;align-items:center;justify-content:center\">\n    <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px;color:#6b7591;background:#fbfaf6;padding:6px 10px;border-radius:6px\">portretfoto Erik in de winkel<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:22px\">\n    <p style=\"margin:0;font-size:14px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#7a9a1c\">Over Printpunt Huizen<\u002Fp>\n    <h2 style=\"margin:0;font-size:clamp(32px,4vw,46px);line-height:1.1;font-weight:700;text-wrap:balance\">21 jaar ervaring in de grafische sector<\u002Fh2>\n    <p style=\"margin:0;font-size:18px;line-height:1.65;color:#55607c\">Mijn carrière begon als creatief DTP'er, waarbij ik me specialiseerde in het ontwerpen en opmaken van diverse drukwerkproducten: van huisstijlen en brochures tot verpakkingen en magazines. Later breidde ik mijn werkzaamheden uit met illustratie.<\u002Fp>\n    <p style=\"margin:0;font-size:18px;line-height:1.65;color:#55607c\">Nu zet ik een nieuwe stap als ondernemer met mijn eigen printshop in Huizen. Ik lever niet alleen printwerk, maar adviseer ook over ontwerp, opmaak en materiaalkeuze.<\u002Fp>\n    <p style=\"margin:0;font-size:18px;line-height:1.5;font-weight:500\">Tot snel bij Printpunt Huizen,<br>Erik van Wijk<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" data-screen-label=\"Contact\" style=\"background:#eef3d6\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:96px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:56px\">\n    <div style=\"display:flex;flex-direction:column;gap:28px\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <p style=\"margin:0;font-size:14px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#5e7a10\">Contact<\u002Fp>\n        <h2 style=\"margin:0;font-size:clamp(32px,4vw,46px);line-height:1.1;font-weight:700\">Waar zit Printpunt Huizen?<\u002Fh2>\n        <p style=\"margin:0;font-size:18px;line-height:1.6;color:#4a5470\">De Regentesse 102, 1273 JZ Huizen. Direct naast Winkelcentrum Oostermeent.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#26325a;color:#fff;border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#cfe26a\">Zo vind je de ingang<\u002Fspan>\n        <span style=\"font-size:18px;line-height:1.5\">Printpunt Huizen heeft geen eigen voordeur. Je komt binnen via verloskundige kliniek <strong>Geboortecentrum Zuiderzee<\u002Fstrong> en loopt door naar achteren.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px\">\n        <a href=\"https://wa.me/31633868444\" style=\"background:#fff;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:4px;color:#2b3550;text-decoration:none\">\n          <span style=\"font-size:13px;color:#6b7591;letter-spacing:0.1em;text-transform:uppercase\">Bel of app<\u002Fspan>\n          <span style=\"font-size:20px;font-weight:700\">06 – 33 86 84 44<\u002Fspan>\n        <\u002Fa>\n        <a href=\"mailto:info@printpunthuizen.nl\" style=\"background:#fff;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:4px;color:#2b3550;text-decoration:none\">\n          <span style=\"font-size:13px;color:#6b7591;letter-spacing:0.1em;text-transform:uppercase\">Mail<\u002Fspan>\n          <span style=\"font-size:18px;font-weight:700;word-break:break-all\">info@printpunthuizen.nl<\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px;font-size:16px;line-height:1.55;color:#4a5470\">\n        <p style=\"margin:0\"><strong style=\"color:#2b3550\">Open<\u002Fstrong> maandag t/m vrijdag, 9.30 – 17.00 uur<\u002Fp>\n        <p style=\"margin:0\"><strong style=\"color:#2b3550\">Parkeren<\u002Fstrong> rondom voldoende plek. Buiten de parkeergarage is het blauwe zone, dus leg je parkeerschijf neer.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-radius:22px;overflow:hidden;min-height:380px;background:#dde3c4\">\n      <iframe title=\"Kaart\" src=\"https://maps.google.com/maps?q=De%20Regentesse%20102%2C%201273%20JZ%20Huizen&amp;z=16&amp;output=embed\" style=\"border:0;width:100%;height:100%;min-height:380px;display:block\" loading=\"lazy\"><\u002Fiframe>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background:#26325a;color:#c4cce0\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:36px 24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:14px\">\n    <span>© Printpunt Huizen · De Regentesse 102, 1273 JZ Huizen<\u002Fspan>\n    <div style=\"display:flex;gap:20px;flex-wrap:wrap\">\n      <a href=\"mailto:info@printpunthuizen.nl\" style=\"color:#fff\">info@printpunthuizen.nl<\u002Fa>\n      <a href=\"https://wa.me/31633868444\" style=\"color:#fff\">06 – 33868444<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;toonOpenStatus&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;toonPortfolio&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() { this.t = setInterval(() => this.forceUpdate(), 60000); }\n  componentWillUnmount() { clearInterval(this.t); }\n  renderVals() {\n    const now = new Date(), d = now.getDay(), m = now.getHours() * 60 + now.getMinutes();\n    const open = d >= 1 && d <= 5 && m >= 570 && m < 1020;\n    return {\n      showStatus: this.props.toonOpenStatus ?? true,\n      showPortfolio: this.props.toonPortfolio ?? true,\n      statusText: open ? 'Nu geopend — tot 17.00 uur' : 'Nu gesloten — ma t/m vr vanaf 9.30 uur',\n      statusColor: open ? '#7fae1c' : '#c2573a'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
